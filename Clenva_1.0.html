<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clenva 1.0 ⭐ — Server Live</title>
    <style>
        :root {
            --bg: #0a0a0f; --surface: #1e1e2a; --border: #2a2a3a;
            --text: #f0f0f4; --accent: #d97757; --gold: #ffd700; --green: #00c853;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI', system-ui, sans-serif;
            background:var(--bg); color:var(--text);
            height:100vh; display:flex; flex-direction:column; overflow:hidden;
        }
        .header {
            background:#131318; padding:10px 15px;
            display:flex; align-items:center; gap:10px;
            border-bottom:1px solid var(--border);
        }
        .logo {
            width:36px; height:36px; border-radius:50%;
            background:#1a1a22; border:2px solid var(--gold);
            display:flex; align-items:center; justify-content:center;
            font-size:20px; color:var(--gold);
        }
        .title { font-weight:700; font-size:16px; }
        .server-badge {
            font-size:9px; color:var(--green);
            background:rgba(0,200,83,0.1); border:1px solid rgba(0,200,83,0.3);
            padding:2px 8px; border-radius:10px; margin-left:5px;
        }
        .chat {
            flex:1; overflow-y:auto; padding:15px;
            display:flex; flex-direction:column; gap:10px;
        }
        .msg { max-width:85%; animation:fadeIn 0.25s; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        .msg.user { align-self:flex-end; }
        .bubble {
            display:inline-block; padding:10px 14px; border-radius:14px;
            background:var(--surface); border:1px solid var(--border);
            font-size:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;
        }
        .msg.user .bubble { background:#2a2a40; }
        .input-area {
            display:flex; gap:8px; padding:10px 15px;
            background:#131318; border-top:1px solid var(--border);
        }
        input {
            flex:1; padding:12px 15px; border-radius:25px;
            border:1px solid #333; background:#0a0a0f; color:#fff;
            font-size:14px; outline:none;
        }
        .send-btn {
            background:var(--accent); color:#fff; border:none;
            border-radius:25px; padding:12px 20px; cursor:pointer; font-weight:700;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⭐</div>
        <div class="title">Clenva 1.0 <span class="server-badge">SERVER LIVE</span></div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Întreabă-mă orice..." autocomplete="off">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>

    <script>
        (function() {
            const chat = document.getElementById('chat');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');

            async function callServer(message) {
                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    const data = await response.json();
                    return data.response;
                } catch(e) {
                    return 'Eroare la conectarea cu serverul.';
                }
            }

            function addMessage(text, isUser) {
                const div = document.createElement('div');
                div.className = 'msg' + (isUser ? ' user' : '');
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                div.appendChild(bubble);
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;
                addMessage(text, true);
                userInput.value = '';
                const reply = await callServer(text);
                addMessage(reply, false);
            }

            sendBtn.addEventListener('click', send);
            userInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

            addMessage('⭐ **Clenva 1.0 — Server Live**\n\nConectat la serverul tău. Rulează 24/7 și învață din fiecare conversație.\n\nÎntreabă-mă orice!', false);
        })();
    </script>
</body>
</html>
